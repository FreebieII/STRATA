# Alembic settings for STRATA's database migrations.
#
# Apply migrations with:   strata db upgrade
# The database address comes from STRATA_ settings and the password from the
# .env secrets file (see migrations/env.py), so no password is written here.

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
