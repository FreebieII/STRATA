# Forwarding /api/... to the STRATA API as /... (the API container is "api").
set $strata_api api:8000;
rewrite ^/api/(.*)$ /$1 break;
proxy_pass http://$strata_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx sets these itself, replacing anything the caller sent, so nobody can
# choose the address the API records and rate-limits logins by.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_redirect off;
# The API sends this header too; nginx adds it to every response anyway.
proxy_hide_header X-Content-Type-Options;
