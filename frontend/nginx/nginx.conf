# nginx for the STRATA dashboard: HTTPS only, the built dashboard as static
# files, and the STRATA API under /api/. It runs as an ordinary user and
# writes only to /tmp, so the container's filesystem can be read-only.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    # The API only ever receives small JSON bodies (a login is well under 2 KB).
    client_max_body_size 16k;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Address, time, method, path WITHOUT the query string, status, size,
    # duration. Never cookies or headers: that is where sessions travel.
    log_format strata '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout strata;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # At most 10 login attempts a minute from one address (a burst of 5 is
    # fine). The API adds its own lock-out after 5 wrong passwords.
    limit_req_zone $binary_remote_addr zone=strata_login:1m rate=10r/m;
    limit_req_status 429;

    # Docker's own DNS, asked again every 10 s, so a recreated API container
    # is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Docker's health check. Listens inside the container only.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /run/secrets/dashboard_cert;
        ssl_certificate_key /run/secrets/dashboard_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:strata_tls:1m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Someone typed http:// for this port: send them to https:// instead.
        error_page 497 =301 https://$http_host$request_uri;

        root /usr/share/nginx/html;
        include /etc/nginx/strata-security-headers.conf;

        # FastAPI's interactive docs load scripts from a CDN, which the
        # Content-Security-Policy forbids, and they are meant for this machine
        # only: http://127.0.0.1:8000/docs.
        location ~ ^/api/(docs|redoc|openapi\.json)(/.*)?$ {
            return 404;
        }

        location = /api/auth/login {
            limit_req zone=strata_login burst=5 nodelay;
            include /etc/nginx/strata-api-proxy.conf;
        }

        location /api/ {
            include /etc/nginx/strata-api-proxy.conf;
        }

        # Built files carry a hash of their content in their names, so a
        # browser may keep them for good.
        location /assets/ {
            include /etc/nginx/strata-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Everything else is the dashboard. Its pages are drawn in the browser,
        # so any other path gets index.html (checked again on every visit).
        location / {
            include /etc/nginx/strata-security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
